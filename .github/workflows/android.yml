name: Android APK

# Builds the Android app (android/) - a WebView shell for the Hebrew Maps server.
#   - push/PR touching android/ : builds the APK and uploads it as a workflow artifact
#   - version tag (v*.*.*)      : also attaches HebrewMaps-<v>.apk and HebrewMaps.apk to the GitHub Release
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*.*.*"]
    paths: ["android/**", "hmaps/**", "web/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "hmaps/**", "web/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then v="${BASH_REMATCH[1]}"; else v="$(python3 tools/set_version.py)"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # web/vendor and web/fonts-ui are gitignored and fetched at build time
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch web assets
        run: |
          pip install -r requirements.txt
          python3 tools/fetch_assets.py

      - name: Build release APK
        working-directory: android
        env:
          HMAPS_VERSION: ${{ steps.version.outputs.value }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "HebrewMaps-${{ steps.version.outputs.value }}.apk"
          cp "HebrewMaps-${{ steps.version.outputs.value }}.apk" HebrewMaps.apk

      - uses: actions/upload-artifact@v6
        with:
          name: HebrewMaps-apk-${{ steps.version.outputs.value }}
          path: HebrewMaps-*.apk

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            HebrewMaps-${{ steps.version.outputs.value }}.apk
            HebrewMaps.apk
